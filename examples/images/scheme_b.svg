<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 300" width="420" height="300" font-family="SimSun, 宋体, serif">
  <rect width="420" height="300" fill="#ffffff"/>

  <text x="210" y="30" text-anchor="middle" font-family="SimHei, 黑体, sans-serif" font-size="14" font-weight="bold" fill="#111">方案 B：分层异构组网</text>

  <!-- 覆盖层 -->
  <rect x="30" y="48" width="360" height="52" rx="5" fill="#eef4fd" stroke="#3b6fb6" stroke-width="1.2"/>
  <text x="210" y="70" text-anchor="middle" font-size="11" fill="#1a3d6d">覆盖层 ｜ 低频段 ｜ 连续覆盖</text>
  <g stroke="#3b6fb6" stroke-width="1.4" fill="#ffffff">
    <polygon points="120,96 110,96 115,80"/>
    <polygon points="300,96 290,96 295,80"/>
  </g>

  <!-- 容量层 -->
  <rect x="30" y="110" width="360" height="52" rx="5" fill="#eefaf2" stroke="#2f8f5b" stroke-width="1.2"/>
  <text x="210" y="132" text-anchor="middle" font-size="11" fill="#14532d">容量层 ｜ 中频段 ｜ 业务承载</text>
  <g fill="#2f8f5b">
    <rect x="114" y="140" width="10" height="16" rx="2"/>
    <rect x="204" y="140" width="10" height="16" rx="2"/>
    <rect x="294" y="140" width="10" height="16" rx="2"/>
  </g>

  <!-- 补充层 -->
  <rect x="30" y="172" width="360" height="52" rx="5" fill="#fdf4ee" stroke="#c2743b" stroke-width="1.2"/>
  <text x="210" y="194" text-anchor="middle" font-size="11" fill="#7a3d10">补充层 ｜ 微站/室分 ｜ 热点吸收</text>
  <g fill="#c2743b">
    <circle cx="120" cy="206" r="4"/>
    <circle cx="210" cy="206" r="4"/>
    <circle cx="300" cy="206" r="4"/>
  </g>

  <!-- 层间协同 -->
  <g stroke="#9aa0a6" stroke-width="1" stroke-dasharray="3 3">
    <line x1="210" y1="100" x2="210" y2="110"/>
    <line x1="210" y1="162" x2="210" y2="172"/>
  </g>
  <text x="228" y="109" font-size="8.5" fill="#6b7280">协同</text>
  <text x="228" y="171" font-size="8.5" fill="#6b7280">协同</text>

  <!-- 特征标注 -->
  <rect x="42" y="236" width="336" height="52" rx="5" fill="#f0f9f3" stroke="#2f8f5b" stroke-width="1"/>
  <text x="210" y="256" text-anchor="middle" font-family="SimHei, 黑体, sans-serif" font-size="12" font-weight="bold" fill="#14532d">结构特征</text>
  <g font-size="11" fill="#1c4d33">
    <text x="58" y="274">· 容量弹性好，覆盖与容量解耦</text>
    <text x="236" y="274">· 需复杂移动性协同</text>
  </g>
</svg>
