<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 300" width="420" height="300" font-family="SimSun, 宋体, serif">
  <rect width="420" height="300" fill="#ffffff"/>

  <text x="210" y="30" text-anchor="middle" font-family="SimHei, 黑体, sans-serif" font-size="14" font-weight="bold" fill="#111">方案 A：单层同构组网</text>

  <!-- 统一宏站层 -->
  <rect x="30" y="52" width="360" height="86" rx="5" fill="#f1f3f5" stroke="#6b7280" stroke-width="1.2"/>
  <text x="210" y="74" text-anchor="middle" font-size="11.5" fill="#374151">统一宏站层（同频同构）</text>

  <g stroke="#6b7280" stroke-width="1.5" fill="#ffffff">
    <polygon points="90,126 78,126 84,98"/>
    <polygon points="210,126 198,126 204,98"/>
    <polygon points="330,126 318,126 324,98"/>
  </g>
  <g fill="#6b7280">
    <circle cx="84" cy="95" r="3"/>
    <circle cx="204" cy="95" r="3"/>
    <circle cx="324" cy="95" r="3"/>
  </g>

  <!-- 覆盖半径 -->
  <g stroke="#adb5bd" stroke-width="1" fill="none" stroke-dasharray="3 3">
    <circle cx="84" cy="126" r="46"/>
    <circle cx="204" cy="126" r="46"/>
    <circle cx="324" cy="126" r="46"/>
  </g>

  <!-- 问题标注 -->
  <rect x="42" y="196" width="336" height="76" rx="5" fill="#fdf2f2" stroke="#c24242" stroke-width="1"/>
  <text x="210" y="218" text-anchor="middle" font-family="SimHei, 黑体, sans-serif" font-size="12" font-weight="bold" fill="#a02020">结构特征</text>
  <g font-size="11" fill="#5a1f1f">
    <text x="58" y="238">· 结构简单，运维成本低</text>
    <text x="58" y="256">· 容量扩展依赖站址加密</text>
    <text x="58" y="268">· 热点与覆盖需求相互牵制</text>
  </g>
</svg>
