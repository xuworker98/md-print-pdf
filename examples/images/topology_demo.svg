<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" width="760" height="420" font-family="SimSun, 宋体, serif">
  <rect width="760" height="420" fill="#ffffff"/>

  <!-- 标题 -->
  <text x="380" y="32" text-anchor="middle" font-family="SimHei, 黑体, sans-serif" font-size="17" font-weight="bold" fill="#111">分层组网逻辑结构示意</text>

  <!-- ===== 覆盖层 ===== -->
  <rect x="30" y="58" width="700" height="94" rx="6" fill="#eef4fd" stroke="#3b6fb6" stroke-width="1.4"/>
  <text x="46" y="82" font-family="SimHei, 黑体, sans-serif" font-size="13" font-weight="bold" fill="#1a3d6d">覆盖层（低频段 700/900 MHz）</text>
  <text x="46" y="102" font-size="11" fill="#333">职责：连续覆盖、移动性保障、语音兜底</text>

  <!-- 三座宏站 -->
  <g stroke="#3b6fb6" stroke-width="1.6" fill="#ffffff">
    <polygon points="120,138 108,138 114,110"/>
    <polygon points="300,138 288,138 294,110"/>
    <polygon points="480,138 468,138 474,110"/>
    <polygon points="640,138 628,138 634,110"/>
  </g>
  <g fill="#3b6fb6">
    <circle cx="114" cy="107" r="3.5"/>
    <circle cx="294" cy="107" r="3.5"/>
    <circle cx="474" cy="107" r="3.5"/>
    <circle cx="634" cy="107" r="3.5"/>
  </g>
  <g font-size="10" fill="#3b6fb6" text-anchor="middle">
    <text x="114" y="150">宏站 A</text>
    <text x="294" y="150">宏站 B</text>
    <text x="474" y="150">宏站 C</text>
    <text x="634" y="150">宏站 D</text>
  </g>

  <!-- 连接线（层间） -->
  <g stroke="#9aa0a6" stroke-width="1.2" stroke-dasharray="4 3">
    <line x1="114" y1="152" x2="160" y2="186"/>
    <line x1="294" y1="152" x2="330" y2="186"/>
    <line x1="474" y1="152" x2="440" y2="186"/>
    <line x1="634" y1="152" x2="600" y2="186"/>
  </g>

  <!-- ===== 容量层 ===== -->
  <rect x="30" y="186" width="700" height="94" rx="6" fill="#eefaf2" stroke="#2f8f5b" stroke-width="1.4"/>
  <text x="46" y="210" font-family="SimHei, 黑体, sans-serif" font-size="13" font-weight="bold" fill="#14532d">容量层（中频段 2.6/3.5 GHz）</text>
  <text x="46" y="230" font-size="11" fill="#333">职责：业务承载、容量弹性、切片资源池</text>

  <g fill="#2f8f5b">
    <rect x="96" y="248" width="12" height="22" rx="2"/>
    <rect x="276" y="248" width="12" height="22" rx="2"/>
    <rect x="406" y="248" width="12" height="22" rx="2"/>
    <rect x="576" y="248" width="12" height="22" rx="2"/>
  </g>
  <g font-size="10" fill="#2f8f5b" text-anchor="middle">
    <text x="160" y="264">AAU-1</text>
    <text x="330" y="264">AAU-2</text>
    <text x="450" y="264">AAU-3</text>
    <text x="612" y="264">AAU-4</text>
  </g>

  <!-- ===== 补充层 ===== -->
  <rect x="30" y="314" width="700" height="86" rx="6" fill="#fdf4ee" stroke="#c2743b" stroke-width="1.4"/>
  <text x="46" y="338" font-family="SimHei, 黑体, sans-serif" font-size="13" font-weight="bold" fill="#7a3d10">补充层（微站 / 室分 / 直放站）</text>
  <text x="46" y="358" font-size="11" fill="#333">职责：热点吸收、室内深度覆盖、立体补盲</text>

  <g fill="#c2743b">
    <circle cx="140" cy="382" r="5"/>
    <circle cx="256" cy="382" r="5"/>
    <circle cx="372" cy="382" r="5"/>
    <circle cx="488" cy="382" r="5"/>
    <circle cx="604" cy="382" r="5"/>
  </g>
  <g font-size="9.5" fill="#8a4a18" text-anchor="middle">
    <text x="140" y="396">微站</text>
    <text x="256" y="396">室分</text>
    <text x="372" y="396">pRRU</text>
    <text x="488" y="396">直放站</text>
    <text x="604" y="396">微站</text>
  </g>
</svg>
